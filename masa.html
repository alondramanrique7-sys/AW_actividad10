    <div class="contenedor">
        <h2>Calculadora de IMC</h2>

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" placeholder="Ej: 70" step="0.1" min="1" value="75">

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" placeholder="Ej: 1.75" step="0.01" min="0.1" value="1.75">

        <button id="btnCalcularIMC">Calcular IMC</button>

        <div id="resultadoIMC">
            <p>Ingresa tus datos para calcular el Índice de Masa Corporal.</p>
        </div>
    </div>
